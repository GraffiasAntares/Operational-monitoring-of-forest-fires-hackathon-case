[project]
name = "forest-fire-monitoring"
version = "0.1.0"
description = "MVP API for wildfire hotspot monitoring"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "hdbscan>=0.8.40",
  "httpx>=0.27",
  "numpy>=1.24,<2",
  "pyproj>=3.6",
  "rasterio>=1.4,<1.6",
  "shapely>=2.0",
  "tifffile>=2024.0",
  "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
ml = ["matplotlib>=3.8", "torch>=2.5"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
